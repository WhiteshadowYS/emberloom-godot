name: templates
# Builds the Ember World engine package (stock BASE + patches/) and publishes Release v<VERSION>:
#   linux editor · linux x86_64 release template · windows x86_64 release template (MinGW-GCC cross build in a
#   Fedora container = the official toolchain; d3d12 + vulkan + ANGLE + AccessKit) · sha256sums.txt
# Runs on every push to main that touches the package and on manual dispatch; the Release is created only when
# the tag v<VERSION> does not exist yet (bump VERSION to publish a new revision).
on:
  push:
    branches: [main]
    paths: [BASE, VERSION, build.sh, apply.sh, 'patches/**', '.github/workflows/templates.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: "create / update the GitHub Release v<VERSION>"
        type: boolean
        default: true

concurrency:
  group: templates-${{ github.ref }}
  cancel-in-progress: false

env:
  SCONSFLAGS: verbose=no progress=no
  SCONS_CACHE_LIMIT: 7168

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      base_tag: ${{ steps.v.outputs.base_tag }}
      base_sha: ${{ steps.v.outputs.base_sha }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          v="$(tr -d '[:space:]' < VERSION)"; read -r tag sha < BASE
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "base_tag=$tag" >> "$GITHUB_OUTPUT"; echo "base_sha=$sha" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-editor,   os: ubuntu-24.04,   what: editor,  out: "godot.linuxbsd.editor.x86_64",            asset: "godot.linuxbsd.editor.x86_64" }
          - { name: linux-template, os: ubuntu-24.04,   what: linux,   out: "godot.linuxbsd.template_release.x86_64",  asset: "linux_release.x86_64" }
          - { name: windows-template, os: ubuntu-24.04, container: "fedora:43", what: windows, out: "godot.windows.template_release.x86_64.exe", asset: "windows_release_x86_64.exe" }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Windows: the official recipe (godot-build-scripts build-windows) = Fedora MinGW-GCC, never MSVC (PRG: MSVC
    # turns LTO off under production and loses the GDScript VM's computed-goto dispatch).
    container: ${{ matrix.container || '' }}
    timeout-minutes: 360
    steps:
      - name: fedora mingw toolchain (windows)
        if: matrix.what == 'windows'
        run: |
          # = godotengine/build-containers Dockerfile.base + .windows; fedora:43 = the GCC 15.2.1 (fc43) that
          # built the official 4.7.2-stable Windows templates (`strings` of the stock exe)
          dnf install -y -q --setopt=install_weak_deps=False bash binutils bzip2 curl file findutils git make \
            patch pkgconfig python3-pip unzip which xz mingw64-gcc mingw64-gcc-c++ mingw64-winpthreads-static
          python3 -m pip install -q scons==4.10.1
          x86_64-w64-mingw32-gcc --version | head -1; scons --version | tail -1

      - uses: actions/checkout@v4

      - name: linux deps
        if: matrix.what != 'windows'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential scons pkg-config libx11-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev \
            libwayland-dev libdbus-1-dev libspeechd-dev libfontconfig-dev

      - name: scons cache
        uses: actions/cache@v4
        with:
          path: .scons_cache
          key: scons-${{ matrix.name }}-${{ needs.meta.outputs.base_sha }}-${{ hashFiles('patches/**', 'build.sh') }}
          restore-keys: |
            scons-${{ matrix.name }}-${{ needs.meta.outputs.base_sha }}-
            scons-${{ matrix.name }}-

      - name: apply (stock BASE + patches)
        shell: bash
        run: ./apply.sh

      - name: D3D12 SDKs + ANGLE + AccessKit (windows, into godot/bin/build_deps like the official build)
        if: matrix.what == 'windows'
        shell: bash
        run: |
          cd godot
          python3 misc/scripts/install_d3d12_sdk_windows.py
          python3 misc/scripts/install_angle.py
          python3 misc/scripts/install_accesskit.py
          ls bin/build_deps

      - name: build
        shell: bash
        env:
          SCONS_JOBS: 4
        run: |
          if [ "${{ matrix.what }}" = windows ]; then
            ./build.sh windows d3d12=yes
            x86_64-w64-mingw32-objdump -p godot/bin/${{ matrix.out }} | grep -E 'LinkerVersion'
          else
            ./build.sh ${{ matrix.what }}
          fi
          ls -la godot/bin

      - name: strip + rename
        shell: bash
        run: |
          mkdir -p out
          cp "godot/bin/${{ matrix.out }}" "out/${{ matrix.asset }}"
          if [ "${{ matrix.what }}" = windows ]; then x86_64-w64-mingw32-strip "out/${{ matrix.asset }}"; else strip "out/${{ matrix.asset }}"; fi
          ls -la out

      # The patched API (new classes / methods / enums) for GDExtensions that use the hooks: godot-rust
      # `api-custom-json` (GODOT4_GDEXTENSION_JSON) reads this file. Stock-API extensions keep working unchanged.
      - name: extension_api.json (editor)
        if: matrix.what == 'editor'
        shell: bash
        run: |
          cd out && "./${{ matrix.asset }}" --headless --dump-extension-api && ls -la extension_api.json
          for c in ViewportUpscaler; do grep -q "\"name\": \"$c\"" extension_api.json || { echo "missing class $c" >&2; exit 1; }; done
          for m in get_taa_jitter driver_callback_add viewport_reset_accumulation get_upscaled_layer get_reset_accumulation; do
            grep -q "\"name\": \"$m\"" extension_api.json || { echo "missing method $m" >&2; exit 1; }; done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 6

      - uses: actions/upload-artifact@v4
        if: matrix.what == 'editor'
        with:
          name: extension_api.json
          path: out/extension_api.json
          if-no-files-found: error

  release:
    needs: [meta, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: sums + notes
        run: |
          cd dist && sha256sum * > sha256sums.txt && cat sha256sums.txt && cd ..
          v="${{ needs.meta.outputs.version }}"
          { echo "Ember World engine package **$v** — stock Godot \`${{ needs.meta.outputs.base_tag}}\` (\`${{ needs.meta.outputs.base_sha }}\`) + $(ls patches/[0-9]*.patch 2>/dev/null | wc -l) patch(es)."
            echo; echo "Patches:"; ls patches/[0-9]*.patch 2>/dev/null | sed 's|^|- |' || true
            echo; echo "Flags: see \`build.sh\` and \`patches/README.md\` (build-flag changes)."
            echo; echo "Assets: linux editor, linux + windows release templates, \`extension_api.json\` (patched API for godot-rust \`api-custom-json\`), \`sha256sums.txt\`. Pinned by build-arena \`engine/VERSION\`."; } > notes.md
      - name: publish v${{ needs.meta.outputs.version }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          v="v${{ needs.meta.outputs.version }}"
          if [ "${{ needs.meta.outputs.exists }}" = true ]; then
            gh release upload "$v" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$v" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$v" dist/* --title "$v" --notes-file notes.md --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
